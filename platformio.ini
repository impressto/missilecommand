; ─────────────────────────────────────────────────────────────────────────────
; PlatformIO project for Missile Command on ESP32-S3 + ST7789V
;
; Board:     ESP32-S3 DevKitC-1
; Display:   ST7789V 240×320 SPI TFT rotated into 320×240 landscape
; Input:     Optional joystick and/or buttons, set with build_flags below
; Library:   Adafruit ST77xx + GFX
; ─────────────────────────────────────────────────────────────────────────────

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Build only sources inside this ESP32 project
build_src_filter =
    +<*>

; Adafruit GFX + ST7789 driver (used inside hal_esp32.cpp)
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    t-vk/ESP32 BLE Mouse @ ^0.3.1

board_build.arduino.memory_type = qio_opi
; ESP32-S3 DevKitC-1 (N16R8) has 16 MB flash — use the large-SPIFFS layout
; which gives ~7 MB for WAV files vs only 1.5 MB with default_8MB.csv
board_upload.flash_size = 16MB
board_build.filesystem = spiffs
board_build.partitions = large_spiffs_16MB.csv

build_flags =
    -DTARGET_ESP32=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; N16R8: 8 MB OPI PSRAM — enables ps_malloc() / heap_caps_malloc(SPIRAM)
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DJOY_ABSOLUTE_MODE=0
    ; ESP32-S3 DevKitC-1 style FSPI wiring. Override to match your board.
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=-1
    -DTFT_BL=8
    ; ── Audio: MAX98357A I2S amplifier ─────────────────────────────────────
    ; Wiring: ESP32-S3 → MAX98357A
    ;   GPIO47 → BCLK
    ;   GPIO45 → LRC / WS
    ;   GPIO38 → DIN
    ;   GPIO21 → SD  (optional amp enable/mute; tie SD high on board to omit)
    ;   5V (or 3V3) → VIN,  GND → GND
    ; All pins on the right side of ESP32-S3 DevKitC-1 for easier wiring
    ; Note: GPIO48 is the onboard RGB LED, so we use GPIO38 instead
    ; WAV files go in data/ and are uploaded with: pio run -t uploadfs
    -DI2S_BCLK_PIN=47
    -DI2S_LRCLK_PIN=45
    -DI2S_DOUT_PIN=38
    -DAMP_SD_PIN=21
    ; WAV master volume (0-255). Lower for less clipping when many effects overlap.
    -DCFG_WAV_MASTER_GAIN=50
    ; Piezo buzzer disabled (I2S audio takes priority when I2S_DOUT_PIN >= 0)
    -DPIEZO_PIN=-1
    ; Optional controls. Set JOY_* to real ADC-capable GPIOs to test joystick movement.
    -DJOY_X_PIN=4
    -DJOY_Y_PIN=5
    ; Joystick feel tuning (absolute mode)
    ; JOY_ABS_DEAD_RAW: larger => bigger center dead-zone, less twitchy
    ; JOY_ABS_SMOOTH_NUM / JOY_ABS_SMOOTH_DEN: closer to 1.0 => more smoothing
    ; Example: 7/8 = smooth, 15/16 = very smooth, 3/4 = more responsive
    -DJOY_ABS_DEAD_RAW=120
    -DJOY_ABS_SMOOTH_NUM=31
    -DJOY_ABS_SMOOTH_DEN=32
    ; Optional calibrated joystick raw range mapping.
    ; Leave commented until JOYSTICK_TEST logs stable min/max values.
    ; -DJOY_CAL_X_MIN=300
    ; -DJOY_CAL_X_MAX=3800
    ; -DJOY_CAL_Y_MIN=260
    ; -DJOY_CAL_Y_MAX=3750
    ; For students: prefer editing values directly in src/game_config.c.
    ; Optional advanced path: override from build flags (wasm-compatible names)
    ; Uncomment examples only if you want compile-time overrides:
    ; -DTEXT_HUD_SCORE_LABEL=\"PTS:\"
    ; -DTEXT_GAME_OVER_TITLE=\"MISSION FAILED\"
    ; -DEXPL_INTERCEPT_R=120
    ; -DEXPL_INTERCEPT_G=255
    ; -DEXPL_INTERCEPT_B=120
    -DLEFT_PIN=-1
    -DRIGHT_PIN=-1
    ; Fire inputs: joystick switch on GPIO 6, button module on GPIO 7.
    -DFIRE_PIN=6
    -DFIRE_PIN_2=7
