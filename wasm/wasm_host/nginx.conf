# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — server block snippet for Missile Command WebAssembly
#
# Paste this inside your existing  server { }  block, or use it as a
# standalone config included from /etc/nginx/sites-enabled/.
#
# Key requirements for serving WebAssembly:
#   1. application/wasm MIME type  (built into nginx ≥ 1.15.6; added below for
#      older versions via the types{} override)
#   2. .data file served as application/octet-stream (Emscripten asset bundle)
#   3. Gzip compression on .js and .wasm saves ~60–70 % bandwidth
#   4. Long-lived cache headers for the immutable binary files
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    # listen 443 ssl;  ← uncomment and add ssl_certificate / ssl_certificate_key

    server_name example.com www.example.com;   # ← change to your domain

    root /var/www/html/missilecommand;         # ← change to your web root
    index index.php index.html;

    # ── PHP processing ───────────────────────────────────────────────────────
    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.2-fpm.sock;   # ← adjust PHP version
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # ── WebAssembly binary (.wasm) ────────────────────────────────────────────
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;

        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
    }

    # ── Emscripten asset bundle (.data) ───────────────────────────────────────
    location ~* \.data$ {
        default_type application/octet-stream;

        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
    }

    # ── JS glue code ─────────────────────────────────────────────────────────
    location ~* missile_command\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
    }

    # ── Gzip for text responses ───────────────────────────────────────────────
    gzip            on;
    gzip_types      text/html application/javascript application/wasm
                    application/octet-stream;
    gzip_min_length 1024;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header Referrer-Policy         "no-referrer"     always;
}
