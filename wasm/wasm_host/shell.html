<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missile Command — WebAssembly</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      font-family: 'Courier New', monospace;
      color: #ccc;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.3em;
      color: #f55;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    #canvasWrapper {
      position: relative;
      border: 2px solid #444;
      box-shadow: 0 0 24px #f550;
    }

    /* Scale canvas up 2× via CSS without blurring */
    #gameCanvas {
      display: block;
      width: min(640px, calc(100vw - 24px), calc((100vh - 180px) * 1.3333));
      height: auto;
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: crosshair;
      touch-action: none;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.05rem;
        letter-spacing: 0.18em;
      }

      #controls {
        font-size: 0.72rem;
        line-height: 1.6;
      }
    }

    #controls {
      margin-top: 14px;
      font-size: 0.78rem;
      color: #666;
      text-align: center;
      line-height: 1.8;
    }

    #controls span {
      color: #aaa;
    }

    #volumeRow {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #volumeRow label {
      color: #666;
      font-size: 0.78rem;
    }

    #volumeSlider {
      -webkit-appearance: none;
      appearance: none;
      width: 110px;
      height: 4px;
      border-radius: 2px;
      background: #333;
      outline: none;
      cursor: pointer;
    }

    #volumeSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f55;
      cursor: pointer;
    }

    #volumeSlider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: none;
      border-radius: 50%;
      background: #f55;
      cursor: pointer;
    }

    #volumeValue {
      color: #aaa;
      font-size: 0.78rem;
      width: 3ch;
      text-align: right;
    }

    #loadingMsg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      font-size: 1rem;
      color: #aaa;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="canvasWrapper">
    <canvas id="gameCanvas" width="320" height="240"></canvas>
    <div id="loadingMsg">Loading…</div>
  </div>

  <div id="controls">
    <span>Mouse</span> — aim &nbsp;|&nbsp;
    <span>Left Click</span> — fire &nbsp;|&nbsp;
    <span>Tap</span> — aim + fire &nbsp;|&nbsp;
    <span>Space / Z</span> — fire (keyboard)
    <div id="volumeRow">
      <label for="volumeSlider">&#128266; Volume</label>
      <input id="volumeSlider" type="range" min="0" max="100" value="70">
      <span id="volumeValue">70%</span>
    </div>
  </div>

  <!--
    The Emscripten-generated .js file is loaded here.
    It expects Module.canvas to point at our <canvas>.
  -->
  <script>
    var Module = {
      canvas: document.getElementById('gameCanvas'),
      _masterVolume: 0.7,
      onRuntimeInitialized: function() {
        document.getElementById('loadingMsg').style.display = 'none';
      }
    };

    (function() {
      var slider = document.getElementById('volumeSlider');
      var label  = document.getElementById('volumeValue');
      slider.addEventListener('input', function() {
        var pct = parseInt(slider.value, 10);
        label.textContent = pct + '%';
        Module._masterVolume = pct / 100;
      });
    })();
  </script>
  {{{ SCRIPT }}}

</body>
</html>
